<!doctype html>
<html lang="en">

<head>
    <title>Drop Game Leaderboard</title>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:title" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

    <style>
        *{font-size:1em;line-height:1;text-decoration:none;margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;touch-action:manipulation;}*::before,*::after{line-height:inherit;box-sizing:inherit}h1,h2,h3,h4,h5,h6{font-weight:normal}ol,ul,li{list-style-type:none}table{border-collapse:collapse}
        input{-webkit-appearance:none;-webkit-border-radius:0;}
        iframe{width:100%;border:none;outline:none;}

        .comfortaa-abc123 {
          font-family: "Comfortaa", sans-serif;
          font-optical-sizing: auto;
          font-weight: 300;
          font-style: normal;
        }

        html, body {
            background: transparent;
            width: 100%;
            height: 100%;
        }

        html {font-size: 1.75vw}

        body {
            display: grid;
            place-content: center;
            user-select: none;
        }

        main {
            font: 1rem/1 arial, sans-serif;
            letter-spacing: 0.25em;
            text-align: center;
            text-transform: uppercase;
            background: rgb(128 128 128 / 25%);
            backdrop-filter: blur(10px);
            color: white;
            width: 75vw;
            padding: 1.5rem;
            border: 1px solid white;

            section {
                line-height: inherit;
                display: flex;
                justify-content: space-between;
                gap: 1.5rem;
                
                span {
                    line-height: inherit;

                    em {
                        font-style: normal;
                        display: block;
                    }
                }
            }

            .x {
                font-size: 1.25rem;
                padding: 1rem 0 2rem;
            }

            .y {
                font-size: 0.5rem;
                padding: 0 1.25rem;
            }

            div {
                max-height: 50vh;
                overflow-x: hidden;
                overflow-y: auto;
            }

            div section {
                background: rgb(255 255 255 / 15%);
                margin: 1.5rem 0 0;
                padding: 1.25rem;
            }   

            div section:not(.empty):first-child {background: rgb(255 255 255 / 30%)}
        }
    </style>
</head>

<body>
    <main class="comfortaa-abc123">
        <section class="x"><span>Drop Game Leaderboard</span></section>
        <section class="y"><span>Name</span><span>Score</span></section>
        <div></div>
    </main>
    <script>
        const main = document.querySelector('main');
        const div = main.querySelector('div');
        const get_data = () => {
            const data = window.location.search.substring(1).split('!').filter(Boolean).sort((a, b) => parseFloat(b.split('-')[1]) - parseFloat(a.split('-')[1]));
            div.insertAdjacentHTML('beforeend', data.map(x => {
                const [name, score] = x.split('-');
                return `<section><span>${name}</span><span>${score}</span></section>`;
            }).join(''));
        };
        if (window.location.search) get_data();
        else div.insertAdjacentHTML('beforeend', '<section class="empty"><span>Data should be supplied in the following format: <em>?username-score!username-score!</em></span></section>');
    </script>
</body>

</html>
