<!doctype html>
<html lang="en">

<head>
    <title>Drop Game Leaderboard</title>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:title" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="" />

    <style>
        *{font-size:1em;line-height:1;text-decoration:none;margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;touch-action:manipulation;}*::before,*::after{line-height:inherit;box-sizing:inherit}h1,h2,h3,h4,h5,h6{font-weight:normal}ol,ul,li{list-style-type:none}table{border-collapse:collapse}
        input{-webkit-appearance:none;-webkit-border-radius:0;}
        iframe{width:100%;border:none;outline:none;}

        @font-face {
            font-family: 'rounded';
            src:url('/obs/fonts/rounded.woff2') format('woff2'),
            url('/obs/fonts/rounded.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'pixel';
            src:url('/obs/fonts/pixel.woff2') format('woff2'),
            url('/obs/fonts/pixel.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        html, body {
            background: transparent;
            width: 100%;
            height: 100%;
        }

        html {font-size: 0.66vw}

        body {
            display: grid;
            place-content: center;
            user-select: none;
            position: relative;
        }

        body:has(.e)::after {
            content: "Data should be appended to the URL in the following format: ?usernameA-score!usernameB-score!";
            font: 1.75rem / 2 'rounded', arial, sans-serif;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            color: #808080;
            margin: 3rem 3rem 2rem;
            display: block;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        main {
            font: 4rem/1 'pixel', sans-serif;
            text-align: center;
            text-shadow: 0 0 0.1em, 0 0 0.5em;
            text-transform: uppercase;
            background: linear-gradient(-45deg, #000, #333);
            color: #fff;
            width: 57.5vw;
            padding: 3rem;
            border-radius: 3rem;
            box-shadow: 0 0 5rem #f8f8f8;
            transition: opacity 1s ease-in-out;
            position: relative;

            section {
                line-height: inherit;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1.5rem;
                
                span {
                    line-height: inherit;

                    em {
                        font-style: normal;
                        display: block;
                    }
                }

                span:only-child {
                    width: 100%;
                }

                span ~ span {
                    font-family: 'pixel';
                    color: dodgerblue;
                }
            }

            .x {
                font-family: 'rounded';
                font-size: 2.5rem;
                letter-spacing: 0.5em;
                color: cyan;
                padding: 1rem 0 0;
            }

            .y {
                padding: 0 2rem;
                opacity: 0.75;
            }

            aside {
                max-height: 24rem;
                margin-top: 3rem;
                overflow: hidden;
                display: flex;
                align-items: end;

                div {
                    width: 100%;
                    transform: translateY(calc(-100% + 24rem));
                    transition: transform 2s ease-in-out;
                }

                .t {transform: translateY(0)}

                section {
                    font-size: 5rem;
                    text-shadow: 0 0 0.05em, 0 0 0.3em;
                    padding: 1.5rem;
                    filter: grayscale(1);
                } 

                section:nth-child(1) {filter: grayscale(0)}
                
                section:nth-child(2) {filter: grayscale(0.33)}

                section:nth-child(3) {filter: grayscale(0.66)}
            }
        }

        main::before,
        main::after {
            content: "";
            border: 1rem dotted dodgerblue;
            border-radius: 5.5rem;
            filter: drop-shadow(0 0 0.5rem cyan);
            position: absolute;
            inset: -2.5rem;
            z-index: -1;
        }

        main::after {
            border-color: #8dc6fd;
            border-radius: 7.5rem;
            filter: drop-shadow(0 0 0.5rem #7efbfb);
            inset: -4.5rem;
        }

        .debug {
            background: #ddd;
        }
    </style>
</head>

<body>
    <main class="font" style="opacity: 0">
        <section class="x"><span>Drop Game Leaderboard</span></section>
        <aside><div></div></aside>
    </main>
    <script>
        const main = document.querySelector('main');
        const aside = main.querySelector('aside');
        const div = aside.querySelector('div');
        const get_data = (data) => {
            data = (data.startsWith('?') ? data.substring(1) : data).split('!').filter(Boolean);
            data = [...data.reduce((m,s)=>(k=s.slice(0,s.lastIndexOf('-')),n=parseFloat(s.slice(s.lastIndexOf('-')+1)),!m.has(k)||n>m.get(k).n?m.set(k,{v:s,n}):m),new Map()).values()].sort((a,b)=>b.n-a.n).map(o=>o.v);
            div.insertAdjacentHTML('beforeend', data.map(x => {
                const [name, score] = x.split('-');
                return `<section><span>${name}</span><span>${score}</span></section>`;
            }).join(''));
        };
        const debug = window.location.href.includes('#');

        if (window.location.search) get_data(window.location.search);
        else {
            const data = '?' + Array.from({ length: 15 }, (_, i) => `user${i+1}-${(Math.random() * 99 + 1).toFixed(2)}`).join('!') + '!';
            get_data(data);
            main.classList.add('e');
        }

        setTimeout(() => div.classList.add('t'), 1e3);

        setTimeout(() => main.removeAttribute('style'), 100);

        if (debug) document.body.classList.add('debug');
        else setTimeout(() => main.style.opacity = 0, 8e3);
    </script>
</body>

</html>
