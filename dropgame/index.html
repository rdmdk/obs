<!doctype html>
<html lang="en">

<head>
    <title>Drop Game Leaderboard</title>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:title" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">

    <style>
        *{font-size:1em;line-height:1;text-decoration:none;margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;touch-action:manipulation;}*::before,*::after{line-height:inherit;box-sizing:inherit}h1,h2,h3,h4,h5,h6{font-weight:normal}ol,ul,li{list-style-type:none}table{border-collapse:collapse}
        input{-webkit-appearance:none;-webkit-border-radius:0;}
        iframe{width:100%;border:none;outline:none;}

        .font {
          font-family: "Oxanium", sans-serif;
          font-optical-sizing: auto;
          font-weight: 300;
          font-style: normal;
        }

        html, body {
            background: transparent;
            width: 100%;
            height: 100%;
        }

        html {font-size: 0.75vw}

        body {
            display: grid;
            place-content: center;
            user-select: none;
        }

        main {
            font: 1rem/1 arial, sans-serif;
            text-align: center;
            text-shadow: 0 0 0.5em;
            background: linear-gradient(-45deg, #000000, #2c5364);
            color: #fff;
            max-width: 75vw;
            padding: 3rem;
            border-radius: 3rem;
            transition: opacity 1s ease-in-out;

            section {
                line-height: inherit;
                display: flex;
                justify-content: space-between;
                gap: 1.5rem;
                
                span {
                    line-height: inherit;

                    em {
                        font-style: normal;
                        display: block;
                    }
                }

                span:only-child {
                    width: 100%;
                }
            }

            .x {
                font-size: 2.5rem;
                padding: 0.5rem 10rem 2rem;
            }

            .y {
                font-size: 1rem;
                padding: 0 2rem;
                opacity: 0.75;
            }

            aside {
                max-height: calc(100vh - 38.75rem);
                margin-top: 3rem;
                overflow: hidden;
                display: flex;
                align-items: end;

                div {
                    width: 100%;
                    transition: transform 2s ease-in-out;
                }

                section {
                    font-size: 2rem;
                    padding: 2rem;
                    opacity: 0.6;
                }   
    
                section ~ section {margin-top: 1.5rem}    

                section:nth-child(1) {opacity: 1}
                
                section:nth-child(2) {opacity: 0.9}
                
                section:nth-child(3) {opacity: 0.8}
                
                section:nth-child(4) {opacity: 0.7}
            }
        }

        .e {position: relative}
        
        .e::after {
            content: "Data should be appended to the URL in the following format: ?usernameA-score!usernameB-score!";
            font-size: 1.5rem;
            line-height: 2;
            text-shadow: none;
            color: #808080;
            width: 100%;
            margin: 3rem 0 0;
            display: block;
            position: absolute;
            top: 100%;
            left: 0;
        }

        .debug {
            background: #ddd;
        }
    </style>
</head>

<body>
    <main class="font" style="opacity: 0">
        <section class="x"><span>Drop Game Leaderboard</span></section>
        <section class="y"><span>Name</span><span>Score</span></section>
        <aside><div></div></aside>
    </main>
    <script>
        const main = document.querySelector('main');
        const aside = main.querySelector('aside');
        const div = aside.querySelector('div');
        const get_data = (data) => {
            data = (data.startsWith('?') ? data.substring(1) : data).split('!').filter(Boolean);
            data = [...data.reduce((m,s)=>(k=s.slice(0,s.lastIndexOf('-')),n=parseFloat(s.slice(s.lastIndexOf('-')+1)),!m.has(k)||n>m.get(k).n?m.set(k,{v:s,n}):m),new Map()).values()].sort((a,b)=>b.n-a.n).map(o=>o.v);
            div.insertAdjacentHTML('beforeend', data.map(x => {
                const [name, score] = x.split('-');
                return `<section><span>${name}</span><span>${score}</span></section>`;
            }).join(''));
        };
        const debug = window.location.href.includes('#');

        if (window.location.search) get_data(window.location.search);
        else {
            const data = '?' + Array.from({ length: 15 }, (_, i) => `user${i+1}-${(Math.random() * 99 + 1).toFixed(2)}`).join('!') + '!';
            get_data(data);
            main.classList.add('e');
        }

        setTimeout(() => {
            const y = aside.getBoundingClientRect().top - div.getBoundingClientRect().top;
            div.style.transform = `translateY(${y}px)`;
        }, 2e3);

        setTimeout(() => main.removeAttribute('style'), 100);

        if (debug) document.body.classList.add('debug');
        else setTimeout(() => main.style.opacity = 0, 8e3);
    </script>
</body>

</html>
