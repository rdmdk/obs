<!doctype html>
<html lang="en">

<head>
    <title>Drop Game Leaderboard</title>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:title" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');

        *{font-size:1em;line-height:1;text-decoration:none;margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;touch-action:manipulation;}*::before,*::after{line-height:inherit;box-sizing:inherit}h1,h2,h3,h4,h5,h6{font-weight:normal}ol,ul,li{list-style-type:none}table{border-collapse:collapse}

        html, body {
            background: transparent;
            width: 100%;
            height: 100%;
        }
        
        html {font-size: 1.5vw}
        
        body {
            font: 1rem/1 'Silkscreen', arial;
            display: flex;
        }
        
        h1 {
            font-size: 1em;
            background: #222;
            color: cyan;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
        }
        
        h1 span {color: #fff}
        
        main {
            text-shadow: 0 0 0.25rem;
            max-width: calc(50vw - 3rem);
            margin: auto;
            transition: opacity 2s linear;
            position: relative;
        }
        
        main::before,
        main::after {
            content: "";
            position: absolute;
            border: 0.35em dashed transparent;
        }
        
        main::before {
            border-color: dodgerblue;
            inset: -1em;
            filter: drop-shadow(0 0 0.1rem dodgerblue);
        }
        
        main::after {
            border-color: cyan;
            inset: -2em;
            filter: drop-shadow(0 0 0.1rem cyan);
        }
        
        section {
            border: 0.35em dashed #222;
            filter: drop-shadow(0 0 0.1rem #222);
        }
        
        section > div {
            background: #222;
            color: #fff;
            max-height: 8.6rem;
            overflow: hidden;
        }

        section div div {
            transition: transform 2s ease-in-out;
            transform: translateY(calc(-100% + 7rem));
        }

        section div div[style] {transform: none}
        
        section em {
            font-size: 1.75em;
            font-style: normal;
            margin: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            gap: 1.5rem;
        }

        section em:first-child {margin-top: 0}
        section em:last-child {margin-bottom: 1.5rem}
        section em span ~ span {color: #1f74c8}

        section em:nth-child(1) span ~ span {color: cyan}
        section em:nth-child(2) span ~ span {color: #42d2ff}
        section em:nth-child(3) span ~ span {color: dodgerblue}
        
    </style>
</head>

<body>
    <main>
        <section>
            <h1>Drop Game Leaderboard <span></span></h1>
            <div>
                <div></div>
            </div>
        </section>
    </main>
    <script>
        const main = document.querySelector('main');
        const div = main.querySelector('div div');
        const get_data = (data) => {
            data = typeof data === 'object' ? data : JSON.parse(decodeURIComponent(data));
            div.innerHTML = Object.entries(data).sort(([kA, vA], [kB, vB]) => (vB - vA) || kA.localeCompare(kB)).map(([k, v]) => `<em><span>${k}</span><span>${v}</span></em>`).join('');
            div.style.transitionDuration = `${Object.entries(data).length / 2}s`;
        };
        const wls = window.location.search;
        const debug = window.location.href.includes('#');

        if (wls) get_data(wls.substring(1));
        else {
            const r_n = Math.floor(Math.random() * 45) + 5;
            const data = Object.fromEntries(Array.from({ length: r_n }, (_, i) => [
                `user${i + 1}`, 
                Number((Math.random() * 100).toFixed(2))
            ]));
            get_data(data);
            main.classList.add('e');
        }

        if (debug) document.body.classList.add('debug');
        else setTimeout(() => main.style.opacity = 0, ((div.children.length / 2) + 3) * 1e3);

        main.querySelector('h1 span').innerText = new Date().getFullYear();
    </script>
</body>

</html>
