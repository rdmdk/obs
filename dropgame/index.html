<!doctype html>
<html lang="en">

<head>
    <title>Drop Game Leaderboard</title>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:title" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

    <style>
        *{font-size:1em;line-height:1;text-decoration:none;margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;touch-action:manipulation;}*::before,*::after{line-height:inherit;box-sizing:inherit}h1,h2,h3,h4,h5,h6{font-weight:normal}ol,ul,li{list-style-type:none}table{border-collapse:collapse}
        input{-webkit-appearance:none;-webkit-border-radius:0;}
        iframe{width:100%;border:none;outline:none;}

        .comfortaa-abc123 {
          font-family: "Comfortaa", sans-serif;
          font-optical-sizing: auto;
          font-weight: 300;
          font-style: normal;
        }

        html, body {
            background: transparent;
            width: 100%;
            height: 100%;
        }

        html {font-size: 0.75vw}

        body {
            display: grid;
            place-content: center;
            user-select: none;
        }

        main {
            font: 1rem/1 arial, sans-serif;
            letter-spacing: 0.5em;
            text-align: center;
            text-transform: uppercase;
            background: #808080;
            color: white;
            max-width: 75vw;
            padding: 3rem;
            transition: opacity 2s ease-in-out;

            section {
                line-height: inherit;
                display: flex;
                justify-content: space-between;
                gap: 1.5rem;
                
                span {
                    line-height: inherit;

                    em {
                        font-style: normal;
                        display: block;
                    }
                }

                span:only-child {
                    width: 100%;
                }
            }

            .x {
                font-size: 2.5rem;
                padding: 0.5rem 10rem 2rem;
            }

            .y {
                font-size: 1rem;
                padding: 0 2rem;
                opacity: 0.75;
            }

            aside {
                max-height: calc(100vh - 38.75rem);
                margin-top: 3rem;
                overflow: hidden;
                display: flex;
                align-items: end;

                div {
                    width: 100%;
                    transition: transform 2s ease-in-out;
                }

                section {
                    font-size: 2rem;
                    background: rgb(255 255 255 / 15%);
                    padding: 2rem;
                }   
    
                section ~ section {margin-top: 1.5rem}
    
                section:not(.empty):first-child {background: rgb(255 255 255 / 50%)}
    
                .empty {
                    font-size: 1rem;
    
                    em {margin: 1rem 0 0}
                } 
            }
        }
    </style>
</head>

<body>
    <main class="comfortaa-abc123" style="opacity: 0">
        <section class="x"><span>Drop Game Leaderboard</span></section>
        <section class="y"><span>Name</span><span>Score</span></section>
        <aside><div></div></aside>
    </main>
    <script>
        const main = document.querySelector('main');
        const aside = main.querySelector('aside');
        const div = aside.querySelector('div');
        const get_data = () => {
            let data = window.location.search.substring(1).split('!').filter(Boolean);
            data = [...data.reduce((m,s)=>(k=s.slice(0,s.lastIndexOf('-')),n=parseFloat(s.slice(s.lastIndexOf('-')+1)),!m.has(k)||n>m.get(k).n?m.set(k,{v:s,n}):m),new Map()).values()].sort((a,b)=>b.n-a.n).map(o=>o.v);
            div.insertAdjacentHTML('beforeend', data.map(x => {
                const [name, score] = x.split('-');
                return `<section><span>${name}</span><span>${score}</span></section>`;
            }).join(''));
        };

        if (window.location.search) get_data();
        else div.insertAdjacentHTML('beforeend', '<section class="empty"><span>Data should be supplied in the following format: <em>?username-score!username-score!</em></span></section>');

        setTimeout(() => {
            const y = aside.getBoundingClientRect().top - div.getBoundingClientRect().top;
            div.style.transform = `translateY(${y}px)`;
        }, 1e3);

        setTimeout(() => main.removeAttribute('style'), 100);
        setTimeout(() => main.style.opacity = 0, 8e3);
    </script>
</body>

</html>
