<!doctype html>
<html lang="en">

<head>
    <title>Drop Game Leaderboard</title>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:title" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');
        
        :root {
            --lightblue: cyan;
            --blue: dodgerblue;
            --mediumblue: #42d2ff;
            --darkblue: #1e90ffa8;
            --gray: #222;
            --clear: transparent;
        }

        *{font-size:1em;line-height:1;text-decoration:none;margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;touch-action:manipulation;}*::before,*::after{line-height:inherit;box-sizing:inherit}h1,h2,h3,h4,h5,h6{font-weight:normal}ol,ul,li{list-style-type:none}table{border-collapse:collapse}

        html, body {
            background: transparent;
            width: 100%;
            height: 100%;
        }
        
        html {font-size: 1.5vw}
        
        body {
            font: 1rem/1 'Silkscreen', arial;
            transition: opacity 0.6s ease-in-out;
            display: flex;
            user-select: none;
        }

        body[style] {transition-duration: 1.6s}
        
        h1 {
            font-size: 1em;
            white-space: pre;
            background: var(--gray);
            color: var(--mediumblue);
            padding: 1.25rem 1.5rem 0;
            display: flex;
            justify-content: center;
        }
        
        h1 span {color: #fff}
        
        main {
            text-shadow: 0 0 0.25rem;
            max-width: calc(66% - 5.5rem);
            margin: auto;
            position: relative;
        }
        
        main::before,
        main::after {
            content: "";
            position: absolute;
            border: 0.35em dashed transparent;
        }
        
        main::before {
            border-color: var(--blue);
            inset: -0.6em;
            filter: drop-shadow(0 0 0.1rem var(--blue));
        }
        
        main::after {
            border-color: var(--lightblue);
            inset: -1.2em;
            filter: drop-shadow(0 0 0.1rem var(--lightblue));
        }
        
        section {
            border: 0.35em dashed var(--gray);
            filter: drop-shadow(0 0 0.1rem var(--gray));
        }
        
        section > div {
            background: var(--gray);
            color: #fff;
            max-height: 9.33rem;
            padding: 1rem 0;
            overflow: hidden;
            position: relative;
        }

        section > div::before,
        section > div::after {
            content: "";
            width: 100%;
            height: 1.4rem;
            display: block;
            position: absolute;
            left: 0;
            z-index: 10;
        }

        section > div::before {
            background: linear-gradient(0deg, var(--clear), var(--gray));
            top: 0;
        }
        
        section > div::after {
            background: linear-gradient(0deg, var(--gray), var(--clear));
            bottom: 0;
        }

        section div div:has(em:nth-of-type(4)) {
            transition: transform 1s ease-in-out;
            transform: translateY(calc(-100% + 7.05rem));
        }

        section div div[style]:has(em:nth-of-type(4)) {transform: none}
        
        section em {
            font-size: 1.75em;
            font-style: normal;
            margin: 0.9rem 1.5rem;
            display: flex;
            justify-content: space-between;
            gap: 1.5rem;
        }

        section em:first-child {margin-top: 0}
        section em:last-child {margin-bottom: 0}

        section em span:first-of-type {
            text-overflow: ellipsis;
            overflow: hidden;
        }
        section em span:last-of-type {color: var(--darkblue)}

        section em:nth-child(1) span:last-of-type {color: var(--lightblue)}
        section em:nth-child(2) span:last-of-type {color: var(--mediumblue)}
        section em:nth-child(3) span:last-of-type {color: var(--blue)}

        .e::after {
            content: 'data should be appended to the URL in this format: ?{"user1":00.00,"user2":00.00}';
            line-height: 1.5;
            text-align: center;
            width: 100%;
            padding: 2rem;
            opacity: 0.33;
            position: absolute;
            left: 0;
            bottom: 0;
        }
        
    </style>
</head>

<body style="opacity: 0;">
    <main>
        <section>
            <h1>Drop Game Leaderboard <span></span></h1>
            <div>
                <div></div>
            </div>
        </section>
    </main>
    <script>
        const main = document.querySelector('main');
        const div = main.querySelector('div div');
        const get_data = (data) => {
            if (typeof data !== 'object') data = JSON.parse(decodeURIComponent(data));
            const filtered_data = Object.entries(data).sort(([kA, vA], [kB, vB]) => (vB - vA) || kA.localeCompare(kB));
            div.innerHTML = filtered_data.map(([k, v]) => `<em><span>${k}</span><span>${Number(v).toFixed(2)}</span></em>`).join('');
            setTimeout(() => div.style.transitionDuration = `${Object.entries(data).length / 2}s`, 2e3);
            document.addEventListener('keypress', e => {
                if (e.code === 'Space') {
                    const x = JSON.stringify(Object.fromEntries(filtered_data));
                    export_file(x);
                }
            });
        };
        const wls = window.location.search;
        const debug = window.location.href.includes('#');

        const export_file = (data) => {
            if (!data) return;
            const blob = new Blob([data], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'leaderboard_data';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        if (wls) get_data(wls.substring(1));
        else {
            const r_n = Math.floor(Math.random() * 45) + 5;
            const data = Object.fromEntries(Array.from({ length: r_n }, (_, i) => [
                `user${i + 1}`, 
                Number((Math.random() * 100).toFixed(2))
            ]));
            get_data(data);
            document.body.classList.add('e');
        }

        setTimeout(() => {
            document.body.removeAttribute('style');
            if (debug) document.body.classList.add('debug');
            else setTimeout(() => document.body.style.opacity = 0, ((div.children.length / 2) + 4) * 1e3);
        }, 1e3);

        main.querySelector('h1 span').innerText = new Date().getFullYear();
    </script>
</body>

</html>
