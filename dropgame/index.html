<!doctype html>
<html lang="en">

<head>
    <title>Drop Game Leaderboard</title>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:title" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

    <style>
        *{font-size:1em;line-height:1;text-decoration:none;margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;touch-action:manipulation;}*::before,*::after{line-height:inherit;box-sizing:inherit}h1,h2,h3,h4,h5,h6{font-weight:normal}ol,ul,li{list-style-type:none}table{border-collapse:collapse}
        input{-webkit-appearance:none;-webkit-border-radius:0;}
        iframe{width:100%;border:none;outline:none;}

        .comfortaa-abc123 {
          font-family: "Comfortaa", sans-serif;
          font-optical-sizing: auto;
          font-weight: 300;
          font-style: normal;
        }

        html, body {
            background: transparent;
            width: 100%;
            height: 100%;
        }

        body {
            display: grid;
            place-content: center;
        }

        main {
            font: 3vw/1.33 arial, sans-serif;
            letter-spacing: 0.25em;
            text-align: center;
            width: 75vw;

            section {
                line-height: inherit;
                display: flex;
                
                span {
                    line-height: inherit;
                    width: 50%;
                    padding: 1em;

                    em {
                        font-family: courier, monospace;
                        font-style: normal;
                        margin: 0.5em 0 0;
                        display: block;
                    }
                }

                span:only-child {
                    text-align: center;
                    width: 100%;
                }
            }

            section:first-child {
                font-weight: 700;
                text-shadow: 0 0 0.15em;
                text-transform: uppercase;
                background: linear-gradient(350deg, gold, orange);
                color: white;
                border-radius: 1em 1em 0 0;
                box-shadow: 0 0 1em gold;
            }

            section:first-child + section {
                font-size: 0.5em;
                font-weight: 700;
                line-height: 1;
                text-transform: uppercase;
                background: white;
                color: #bbb;
                box-shadow: 0 0 1em white;

                span {
                    padding-block: 1.5em;
                }
            }

            section:nth-child(2) ~ section {border-top: 1px solid #ddd}

            section:last-child {border-radius: 0 0 1em 1em}
            
            section.empty:last-child {
                opacity: 0.33;
            }
        }
    </style>
</head>

<body>
    <main class="comfortaa-abc123">
        <section><span>Drop Game Leaderboard</span></section>
        <section><span>Name</span><span>Score</span></section>
    </main>
    <script>
        const main = document.querySelector('main');
        const get_data = () => {
            const data = window.location.search.substring(1).split('!').filter(Boolean).sort((a, b) => parseFloat(b.split('-')[1]) - parseFloat(a.split('-')[1]));
            main.insertAdjacentHTML('beforeend', data.map(x => {
                const [name, score] = x.split('-');
                return `<section><span>${name}</span><span>${score}</span></section>`;
            }).join(''));
        };
        if (window.location.search) get_data();
        else main.insertAdjacentHTML('beforeend', '<section class="empty"><span>Data should be supplied in the following format: <em>?username-score!username-score!</em></span></section>');
    </script>
</body>

</html>
