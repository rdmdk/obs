<!doctype html>
<html lang="en">

<head>
    <title>Drop Game Leaderboard</title>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:title" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="" />

    <style>
        *{font-size:1em;line-height:1;text-decoration:none;margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;touch-action:manipulation;}*::before,*::after{line-height:inherit;box-sizing:inherit}h1,h2,h3,h4,h5,h6{font-weight:normal}ol,ul,li{list-style-type:none}table{border-collapse:collapse}
        input{-webkit-appearance:none;-webkit-border-radius:0;}
        iframe{width:100%;border:none;outline:none;}

        main {
            font: 3.33vw arial, sans-serif;

            section {
                display: flex;
                
                span {
                    width: 50%;
                    padding: 0.66em;
                }

                span:only-child) {
                    width: 100%;
                }
            }

            section:first-child {
                font-weight: bold;
                text-transform: uppercase;
            }

            section.empty:last-child {
                opacity: 0.33;
            }
        }
    </style>
</head>

<body>
    <main>
        <section><span>Drop Game Leaderboard</span></section>
        <section><span>Name</span><span>Score</span></section>
    </main>
    <script>
        const main = document.querySelector('main');
        const get_data = () => {
            const data = window.location.search.substring(1).split('!').filter(Boolean).sort((a, b) => parseFloat(b.split('-')[1]) - parseFloat(a.split('-')[1]));
            main.insertAdjacentHTML('beforeend', data.map(x => {
                const [name, score] = x.split('-');
                return `<section><span>${name}</span><span>${score}</span></section>`;
            }).join(''));
        };
        if (window.location.search) get_data();
        else {main.insertAdjacentHTML('beforeend', ('<section class="empty"><span>Data should be supplied in the following format: ?username-score!username-score!</span></section>')};
    </script>
</body>

</html>
